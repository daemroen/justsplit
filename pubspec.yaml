name: myapp
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # Upgrade Firebase core packages to support latest firebase_ai
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  provider: ^6.1.2
  google_fonts: ^6.2.1
  # Keep google_sign_in pinned to avoid breaking changes
  google_sign_in: ^6.2.1
  image_picker: ^1.1.2
  # Use newer firebase_ai for Gemini features
  firebase_ai: ^3.0.0
  uuid: ^4.5.2
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - web/icons/
